name: CI Private

# This workflow is separate from the package-free, PR-controlled ci.yml. It
# runs only from a push to the protected default branch, so package credentials
# are never present while pull-request code is being tested.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  verify-private-push:
    # Only the protected main branch can trigger this package-read path.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: cail-sandbox-client
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Keep the package credential in a mode-600 regular file outside the
      # checkout. Remove and verify its absence before any project code runs.
      - name: Install frozen dependencies
        working-directory: cail-sandbox-client
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          umask 077
          config_path="$(mktemp "$RUNNER_TEMP/cail-sandbox-client-bunfig.XXXXXX.toml")"
          cleanup() {
            local status=$?
            trap - EXIT HUP INT TERM
            rm -f -- "$config_path"
            if [[ -e "$config_path" || -L "$config_path" ]]; then
              echo "temporary Bun config cleanup failed" >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT HUP INT TERM
          [[ -f "$config_path" && ! -L "$config_path" ]]
          printf '%s\n' \
            '[install.scopes]' \
            '"@cuny-ai-lab" = { token = "$GITHUB_PACKAGES_TOKEN", url = "https://npm.pkg.github.com" }' > "$config_path"
          chmod 600 "$config_path"
          bun install --config="$config_path" --frozen-lockfile --ignore-scripts --no-cache
          rm -f -- "$config_path"
          [[ ! -e "$config_path" && ! -L "$config_path" ]]
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source, tests, build, and pinned contract
        working-directory: cail-sandbox-client
        run: bun run check

      - name: Verify committed build parity
        working-directory: cail-sandbox-client
        run: git diff --exit-code -- dist
