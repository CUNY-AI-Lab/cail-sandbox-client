name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This is the required, package-free guard. It is intentionally unconditional
    # so fork and Dependabot pull requests cannot satisfy it by skip-success.
    permissions:
      contents: read
    steps:
      - name: Check out client
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: cail-sandbox-client
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify package shape
        working-directory: cail-sandbox-client
        run: bun pm pack --dry-run --ignore-scripts

      - name: Scan repository history for secrets
        working-directory: cail-sandbox-client
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            /repo
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --no-banner --redact /repo
