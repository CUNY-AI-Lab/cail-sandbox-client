name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out client
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: cail-sandbox-client
          fetch-depth: 0
          persist-credentials: false

      - name: Download canonical gateway contract
        env:
          CAIL_GATEWAY_READ_TOKEN: ${{ secrets.CAIL_GATEWAY_READ_TOKEN }}
        run: |
          if [ -z "$CAIL_GATEWAY_READ_TOKEN" ]; then
            echo "::error::CAIL_GATEWAY_READ_TOKEN must grant contents:read access to CUNY-AI-Lab/cail-gateway"
            exit 1
          fi
          contract="$RUNNER_TEMP/cail-gateway-sandbox-openapi.json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github.raw+json" \
            --header "Authorization: Bearer $CAIL_GATEWAY_READ_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$contract" \
            "https://api.github.com/repos/CUNY-AI-Lab/cail-gateway/contents/sandbox-bridge/src/openapi.json"
          test -s "$contract"
          echo "CAIL_GATEWAY_OPENAPI=$contract" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        working-directory: cail-sandbox-client
        run: bun install --frozen-lockfile

      - name: Verify source, tests, build, and gateway parity
        working-directory: cail-sandbox-client
        run: bun run check

      - name: Verify committed build parity
        working-directory: cail-sandbox-client
        run: git diff --exit-code -- dist

      - name: Verify package contents
        working-directory: cail-sandbox-client
        run: bun pm pack --dry-run

      - name: Scan repository history for secrets
        working-directory: cail-sandbox-client
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            /repo
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --no-banner --redact /repo
