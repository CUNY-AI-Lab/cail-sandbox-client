name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out client
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config_dir="$(mktemp -d "${RUNNER_TEMP%/}/cail-sandbox-client-bunfig.XXXXXX")"
          config_path="$config_dir/bunfig.toml"
          trap 'rm -rf "$config_dir"' EXIT
          printf '[install.scopes]\n"@cuny-ai-lab" = { token = "%s", url = "https://npm.pkg.github.com" }\n' "$GITHUB_PACKAGES_TOKEN" > "$config_path"
          chmod 600 "$config_path"
          bun install --config="$config_path" --frozen-lockfile --ignore-scripts
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit dependencies
        run: bun audit --audit-level high
      - name: Check source, tests, build, and package
        run: bun run check
