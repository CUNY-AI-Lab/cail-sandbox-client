name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out client
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config_dir="$(mktemp -d "${RUNNER_TEMP%/}/cail-sandbox-client-bunfig.XXXXXX")"
          config_path="$config_dir/bunfig.toml"
          printf '[install.scopes]\n"@cuny-ai-lab" = { url = "https://npm.pkg.github.com", token = "%s" }\n' "$GITHUB_PACKAGES_TOKEN" > "$config_path"
          chmod 600 "$config_path"
          bun install --config="$config_path" --frozen-lockfile --ignore-scripts
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check source, tests, build, and package
        run: bun run check
