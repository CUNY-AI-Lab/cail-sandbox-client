name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config_dir="$(mktemp -d "${RUNNER_TEMP%/}/cail-sandbox-client-bunfig.XXXXXX")"
          config_path="$config_dir/bunfig.toml"
          trap 'rm -rf "$config_dir"' EXIT
          printf '[install.scopes]\n"@cuny-ai-lab" = { token = "%s", url = "https://npm.pkg.github.com" }\n' "$GITHUB_PACKAGES_TOKEN" > "$config_path"
          chmod 600 "$config_path"
          bun install --config="$config_path" --frozen-lockfile --ignore-scripts
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          case "$package_version" in
            *-*)
              echo "Package version must be stable: $package_version" >&2
              exit 1
              ;;
          esac
          test "$RELEASE_TAG" = "v$package_version"

      - name: Check source, tests, build, and package
        run: bun run check

      - name: Publish to GitHub Packages
        run: bun publish --registry https://npm.pkg.github.com
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
