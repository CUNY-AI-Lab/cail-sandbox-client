name: Publish

on:
  release:
    types: [published]

# Trusted publishing: npm accepts this workflow's short-lived OIDC identity,
# so no npm token is stored anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          case "$package_version" in
            *-*)
              echo "Package version must be stable: $package_version" >&2
              exit 1
              ;;
          esac
          test "$RELEASE_TAG" = "v$package_version"

      - name: Check source, tests, build, and package
        run: bun run check

      # npm trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - name: Set up Node for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the npm CLI that supports trusted publishing
        run: npm install --global npm@11.20.0

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
